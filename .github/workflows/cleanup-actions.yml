name: Cleanup Actions History

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Playwright E2E
      - Deploy GitHub Pages
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep 50 Playwright E2E runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$REPO/actions/workflows/playwright.yml/runs?per_page=100" --jq '.workflow_runs[].id' | tail -n +51)"
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/runs/$id"
          done

      - name: Keep 10 Deploy GitHub Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$REPO/actions/workflows/pages.yml/runs?per_page=100" --jq '.workflow_runs[].id' | tail -n +11)"
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/runs/$id"
          done

      - name: Keep 10 Cleanup Actions History runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$REPO/actions/workflows/cleanup-actions.yml/runs?per_page=100" --jq '.workflow_runs[].id' | tail -n +11)"
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/runs/$id"
          done

      - name: Keep 10 pages-build-deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api --paginate "repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[] | select(.name=="pages-build-deployment") | .id' | head -n 1)"
          if [ -n "$workflow_id" ]; then
            ids="$(gh api --paginate "repos/$REPO/actions/workflows/$workflow_id/runs?per_page=100" --jq '.workflow_runs[].id' | tail -n +11)"
            for id in $ids; do
              gh api --method DELETE "repos/$REPO/actions/runs/$id"
            done
          fi
