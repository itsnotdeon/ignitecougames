name: Playwright E2E

on:
  push:
    branches: ["redesign/guided-journey"]
  pull_request:
    branches: ["redesign/guided-journey"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
