name: Debug IGNITE Boot
on:
  push:
    branches:
      - refactor/architecture-cleanup
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/debug-boot.spec.js --workers=1