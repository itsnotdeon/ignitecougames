name: Playwright QA Shards

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: playwright-qa-shards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: find redesign/scripts -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: node --input-type=module --check < redesign/scripts/app.js
      - name: Run Playwright shard
        run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/6
      - name: Upload shard results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
