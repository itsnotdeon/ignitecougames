name: Playwright QA Shards

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: playwright-qa-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/6, 2/6, 3/6, 4/6, 5/6, 6/6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: find redesign/scripts -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: node --input-type=module --check < redesign/scripts/app.js
      - name: Run Playwright shard
        run: npm run test:e2e -- --workers=1 --shard=${{ matrix.shard }}
