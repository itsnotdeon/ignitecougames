<!doctype html><html><body><pre id="out">diagnostic</pre><script>window.addEventListener("error",e=>{document.querySelector("#out").textContent="ERROR "+e.filename+" @ "+e.lineno+":"+e.colno+"\n"+e.message+"\n"+String(e.error?.stack||"")});window.addEventListener("unhandledrejection",e=>{document.querySelector("#out").textContent="REJECTION\n"+String(e.reason?.stack||e.reason)});</script><script type="module" src="./scripts/app.js?v=diag"></script></body></html>
