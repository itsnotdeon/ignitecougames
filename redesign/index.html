<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160a11">
<meta name="description" content="IGNITE — a couple experience app.">
<title>IGNITE — Couple Experience</title>
<link rel="stylesheet" href="./styles/app.css">
<link rel="stylesheet" href="./styles/phase6.css">
</head>
<body>
<main id="app" class="app-shell">
<section class="boot-screen" aria-label="IGNITE loading">
  <div class="boot-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="boot-brand">IGNITE</div>
  <div class="boot-kicker">COUPLE EXPERIENCE</div>
  <h1>Preparing your moment.</h1>
  <p id="boot-status" class="boot-status">Starting IGNITE…</p>
  <div class="boot-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="boot-progress-fill"></span></div>
  <div class="boot-progress-meta"><span>LOADING</span><strong id="boot-progress-value">0%</strong></div>
</section>
</main>
<script>
(async function(){
  const app=document.querySelector("#app");
  const status=document.querySelector("#boot-status");
  const fill=document.querySelector("#boot-progress-fill");
  const value=document.querySelector("#boot-progress-value");
  const bar=document.querySelector(".boot-progress");
  const revision="20260924-03";
  const modules=[
    "./scripts/journey/mechanics.js",
    "./scripts/data/topics.js",
    "./scripts/progression.js",
    "./scripts/journey/content.js",
    "./scripts/features/ui.js",
    "./scripts/features/memories.js",
    "./scripts/ui/accessibility.js",
    "./scripts/minigames/roleplay.js",
    "./scripts/minigames/kingslave.js",
    "./scripts/minigames/chess.js",
    "./scripts/minigames/snake.js",
    "./scripts/minigames/index.js"
  ];
  const startedAt=performance.now();
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const setProgress=(percent,label)=>{
    const n=Math.max(0,Math.min(100,Math.round(percent)));
    if(fill)fill.style.width=n+"%";
    if(value)value.textContent=n+"%";
    if(bar)bar.setAttribute("aria-valuenow",String(n));
    if(status)status.textContent=label;
  };
  const showError=(stage,error)=>{
    const message=String(error&&error.message||error||"Unknown error");
    const stack=String(error&&error.stack||"");
    console.error("[IGNITE BOOT ERROR]",stage,error);
    app.innerHTML='<section class="boot-error"><div class="boot-brand">IGNITE</div><div class="boot-kicker">BOOT ERROR</div><h1>Something interrupted the start.</h1><p>Stage: <strong>'+stage+'</strong></p><pre>'+message+"\n\n"+stack+'</pre><button class="btn primary" id="ignite-reset-reload">Reset &amp; Reload</button></section>';
    document.querySelector("#ignite-reset-reload")?.addEventListener("click",()=>{
      localStorage.removeItem("ignite-redesign-v4");
      sessionStorage.removeItem("ignite-welcome-seen");
      location.reload();
    });
  };
  try{
    setProgress(4,"Starting IGNITE…");
    await sleep(120);
    for(let i=0;i<modules.length;i++){
      const path=modules[i];
      setProgress(8+(i/modules.length)*78,"Preparing "+path.split("/").pop()+"…");
      await Promise.race([
        import(path+"?v="+revision),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error("Timeout loading module")),10000))
      ]);
    }
    setProgress(90,"Starting your experience…");
    await Promise.race([
      import("./scripts/app.js?v="+revision),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Timeout loading app.js")),10000))
    ]);
    const elapsed=performance.now()-startedAt;
    if(elapsed<720)await sleep(720-elapsed);
    setProgress(100,"Ready.");
    await sleep(900);
  }catch(error){
    showError(status?.textContent||"unknown",error);
  }
})();
</script>
</body>
</html>
