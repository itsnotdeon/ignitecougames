<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160a11">
<meta name="description" content="IGNITE — a couple experience app.">
<title>IGNITE — Couple Experience</title>
<link rel="stylesheet" href="./styles/app.css">
<link rel="stylesheet" href="./styles/phase6.css">
</head>
<body>
<main id="app" class="app-shell"><section style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:system-ui;background:#160a11"><div style="max-width:720px;width:100%;text-align:center"><div style="font-size:12px;letter-spacing:.18em;opacity:.7;margin-bottom:14px">IGNITE BOOT</div><h1 style="font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:0 0 12px">IGNITE sedang memuat.</h1><p id="boot-status" style="opacity:.8">Memeriksa module aplikasi…</p></div></section></main>
<script>
(async function(){
  const app=document.querySelector("#app");
  const status=document.querySelector("#boot-status");
  const revision="20260924-01";
  const modules=[
    "./scripts/journey/mechanics.js",
    "./scripts/data/topics.js",
    "./scripts/progression.js",
    "./scripts/journey/content.js",
    "./scripts/features/ui.js",
    "./scripts/features/memories.js",
    "./scripts/ui/accessibility.js",
    "./scripts/minigames/roleplay.js",
    "./scripts/minigames/kingslave.js",
    "./scripts/minigames/chess.js",
    "./scripts/minigames/snake.js",
    "./scripts/features/memories.js",
    "./scripts/minigames/index.js"
  ];
  const setStatus=(text)=>{if(status)status.textContent=text};
  const showError=(stage,error)=>{
    const message=String(error&&error.message||error||"Unknown error");
    const stack=String(error&&error.stack||"");
    console.error("[IGNITE BOOT ERROR]",stage,error);
    app.innerHTML='<section style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:system-ui;background:#160a11"><div style="max-width:820px;width:100%"><div style="font-size:12px;letter-spacing:.18em;opacity:.7;margin-bottom:14px">IGNITE BOOT ERROR</div><h1 style="font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:0 0 18px">Module gagal dimuat.</h1><p style="opacity:.85">Stage: <strong>'+stage+'</strong></p><pre style="white-space:pre-wrap;word-break:break-word;background:#24121a;border:1px solid #4a2734;border-radius:14px;padding:16px;font-size:12px;line-height:1.5;max-height:340px;overflow:auto">'+message+'\n\n'+stack+'</pre><button id="ignite-reset-reload" style="padding:12px 18px;border:0;border-radius:12px">Reset &amp; Reload</button></div></section>';
    document.querySelector("#ignite-reset-reload")?.addEventListener("click",()=>{localStorage.removeItem("ignite-redesign-v4");location.reload()});
  };
  try{
    for(const path of modules){
      setStatus("Memeriksa "+path);
      await Promise.race([import(path+"?v="+revision),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Timeout loading module")),10000))]);
    }
    setStatus("Memulai aplikasi…");
    await Promise.race([import("./scripts/app.js?v="+revision),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Timeout loading app.js")),10000))]);
  }catch(error){
    showError(status?.textContent||"unknown",error);
  }
})();
</script>
</body>
</html>
